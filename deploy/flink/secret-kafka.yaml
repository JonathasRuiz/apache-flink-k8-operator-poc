# Kafka connection Secret.
#
# The Flink job reads connection details from THIS Secret (mounted as env vars),
# never from hardcoded values in job code. Swapping environments = swapping the
# contents of this Secret + the bootstrap address in the values file. No code
# change.
#
# ---------------------------------------------------------------------------
# DEV (bare-metal PoC): local Kafka is PLAINTEXT, so there are no real
# credentials. This placeholder exists only so the job's env wiring is uniform
# across environments (the job always reads KAFKA_* from the Secret).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: kafka-connection
  namespace: flink
  labels:
    app.kubernetes.io/part-of: flink-operator-poc
type: Opaque
stringData:
  KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  # The following are intentionally empty in dev (PLAINTEXT needs none).
  KAFKA_SASL_MECHANISM: ""
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""

# ---------------------------------------------------------------------------
# QA / PROD (EKS) Secret shape — DO NOT COMMIT REAL CREDENTIALS.
# Create this out-of-band (sealed-secrets / external-secrets / SSM), same NAME
# "kafka-connection" so no manifest references change. Aiven uses SASL_SSL and,
# where mTLS is required, client cert/key + CA mounted as files.
#
#   stringData:
#     KAFKA_BOOTSTRAP_SERVERS: "<aiven-host>:<port>"
#     KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
#     KAFKA_SASL_MECHANISM:    "SCRAM-SHA-512"   # or PLAIN, per Aiven service
#     KAFKA_SASL_USERNAME:     "<avnadmin-or-service-user>"
#     KAFKA_SASL_PASSWORD:     "<password>"
#   # For mTLS, additionally mount these as files and point the job's
#   # ssl.truststore / ssl.keystore properties at them:
#   #   ca.pem, service.cert, service.key
# ---------------------------------------------------------------------------
